[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "aws-security-configuration-auditor"
version = "1.0.0"
description = "Seven read-only AWS configuration controls with explicit incomplete-scan reporting"
requires-python = ">=3.11"
authors = [{name = "Michael Morris"}]

[project.optional-dependencies]
live = ["boto3==1.44.6"]

[project.scripts]
aws-security-auditor = "aws_security_auditor.__main__:main"

[tool.setuptools.packages.find]
include = ["aws_security_auditor*"]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
